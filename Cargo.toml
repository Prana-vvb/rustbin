[package]
name = "rustbin"
version = "0.1.0"
edition = "2021"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3", default-features = false }
short-uuid = "0.2"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
